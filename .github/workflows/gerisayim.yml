name: Geri Sayım

on:
  push:
    paths:
      - "GeriSayim/**"
      - ".github/workflows/gerisayim.yml"
  workflow_dispatch:

jobs:
  derle:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: GeriSayim
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode projesini oluştur
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Simülatörü hazırla
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          [ -d ornek-fotolar ] && xcrun simctl addmedia "$UDID" ornek-fotolar/*.jpg || true

      - name: Derle ve kullanıcı testini çalıştır
        run: |
          xcodebuild -project GeriSayim.xcodeproj -scheme GeriSayim \
            -destination "id=$UDID" -resultBundlePath sonuc.xcresult \
            CODE_SIGNING_ALLOWED=NO -quiet test

      - name: Ekran görüntülerini çıkar
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ekran"
          xcrun xcresulttool export attachments --path sonuc.xcresult --output-path ham || exit 0
          python3 - <<'EOF'
          import json, os, shutil
          liste = json.load(open("ham/manifest.json"))
          for test in liste:
              for ek in test.get("attachments", []):
                  ad = ek.get("suggestedHumanReadableName") or ek["exportedFileName"]
                  ad = ad.split("_0_")[0]
                  if not ad.endswith(".png"):
                      ad += ".png"
                  shutil.copy(os.path.join("ham", ek["exportedFileName"]),
                              os.path.join(os.environ["GITHUB_WORKSPACE"], "ekran", ad))
          EOF
          ls "$GITHUB_WORKSPACE/ekran"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gerisayim-ekran-goruntuleri
          path: ekran/
          if-no-files-found: ignore
