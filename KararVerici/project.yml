name: KararVerici
options:
  bundleIdPrefix: com.kuzeykilinc
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  KararVerici:
    build:
      targets:
        KararVerici: all
        KararVericiUITests: [test]
    test:
      targets:
        - KararVericiUITests
targets:
  KararVericiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KararVericiUITests
    dependencies:
      - target: KararVerici
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuzeykilinc.kararverici.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  KararVerici:
    type: application
    platform: iOS
    sources:
      - path: KararVerici
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuzeykilinc.kararverici
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: KararVerici/Info.plist
      properties:
        CFBundleDisplayName: Karar Verici
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
