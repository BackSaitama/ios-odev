name: GeriSayim
options:
  bundleIdPrefix: com.kuzeykilinc
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  GeriSayim:
    build:
      targets:
        GeriSayim: all
        GeriSayimUITests: [test]
    test:
      targets:
        - GeriSayimUITests
targets:
  GeriSayimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GeriSayimUITests
    dependencies:
      - target: GeriSayim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuzeykilinc.gerisayim.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  GeriSayimWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GeriSayimWidget
      - path: GeriSayim/Paylasilan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuzeykilinc.gerisayim.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: GeriSayimWidget/GeriSayimWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kuzeykilinc.gerisayim
    info:
      path: GeriSayimWidget/Info.plist
      properties:
        CFBundleDisplayName: Geri Sayım
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  GeriSayim:
    type: application
    platform: iOS
    sources:
      - path: GeriSayim
    dependencies:
      - target: GeriSayimWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuzeykilinc.gerisayim
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: GeriSayim/GeriSayim.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kuzeykilinc.gerisayim
    info:
      path: GeriSayim/Info.plist
      properties:
        CFBundleDisplayName: Geri Sayım
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
